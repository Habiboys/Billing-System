openapi: 3.0.0
info:
  title: Billing System API
  version: 1.0.0
  description: API documentation for the Billing System application
servers:
  - url: http://34.101.143.2:3000/api
    description: Deploy Server
  - url: https://sponge-quiet-brightly.ngrok-free.app/api
    description: Tunnel Server
  - url: http://localhost:3000/api
    description: Local Development

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        token:
          type: string
        type:
          type: string
          enum: [admin, user]
      required:
        - email
        - password
    
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
        categoryName:
          type: string
        cost:
          type: integer
          description: Cost per unit time
        satuanWaktu:
          type: string
          enum: [detik, menit, jam]
        description:
          type: string
      required:
        - categoryName
        - cost
        - satuanWaktu
    
    Device:
      type: object
      properties:
        id:
          type: string
          description: Device ID yang terkoneksi ke WebSocket server
        name:
          type: string
          description: Nama device
        categoryId:
          type: string
          format: uuid
          description: ID kategori device
        timerStart:
          type: string
          format: date-time
          description: Waktu mulai timer
        timerDuration:
          type: integer
          description: Durasi timer dalam milliseconds
        timerElapsed:
          type: integer
          description: Waktu yang sudah berlalu dalam milliseconds
        timerStatus:
          type: string
          enum: [start, stop, end]
        lastPausedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - categoryId
    
    Transaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        deviceId:
          type: string
          description: ID device yang digunakan
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
          nullable: true
        duration:
          type: integer
          description: Durasi dalam milliseconds
        cost:
          type: integer
          description: Biaya transaksi
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - deviceId
        - duration
        - cost

paths:
  # AUTH ROUTES
  /auth/login:
    post:
      summary: User login
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
              required:
                - email
                - password
              example:
                email: admin@example.com
                password: admin123
      responses:
        "200":
          description: Login berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                          email:
                            type: string
                          type:
                            type: string
                      accessToken:
                        type: string
                      refreshToken:
                        type: string
        "401":
          description: Email atau password salah

  /auth/refresh-token:
    post:
      summary: Refresh authentication token
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
              required:
                - refreshToken
      responses:
        "200":
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
        "401":
          description: Invalid refresh token

  /auth/create-user:
    post:
      summary: Create a new user (Admin only)
      tags: [Authentication]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User"
      responses:
        "201":
          description: User created successfully
        "403":
          description: Forbidden (Admin access required)

  # CATEGORY ROUTES
  /category/create:
    post:
      summary: Create a new category (Admin only)
      tags: [Category]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Category"
      responses:
        "201":
          description: Category created successfully
        "403":
          description: Forbidden (Admin access required)

  /category:
    get:
      summary: Get all categories
      tags: [Category]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Category"

  /category/{id}:
    get:
      summary: Get category by ID
      tags: [Category]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: Category ID
      responses:
        "200":
          description: Category data
        "404":
          description: Category not found

  /category/update/{id}:
    put:
      summary: Update category by ID (Admin only)
      tags: [Category]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: Category ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Category"
      responses:
        "200":
          description: Category updated successfully
        "403":
          description: Forbidden (Admin access required)
        "404":
          description: Category not found

  /category/delete/{id}:
    delete:
      summary: Delete category by ID (Admin only)
      tags: [Category]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: Category ID
      responses:
        "200":
          description: Category deleted successfully
        "404":
          description: Category not found

  # DEVICE ROUTES
  /device/create:
    post:
      summary: Create a new device
      tags: [Device]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Device"
      responses:
        "201":
          description: Device created successfully
        "400":
          description: Device belum terkoneksi ke server WebSocket

  /device:
    get:
      summary: Get all devices
      tags: [Device]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of devices with connection status
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/Device"
                        - type: object
                          properties:
                            isConnected:
                              type: boolean
                            status:
                              type: string
                              enum: [on, off, pause]

  /device/{id}:
    get:
      summary: Get device by ID
      tags: [Device]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: Device ID
      responses:
        "200":
          description: Device data
        "404":
          description: Device not found

  /device/update/{id}:
    put:
      summary: Update device by ID
      tags: [Device]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: Device ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                categoryId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Device updated successfully
        "404":
          description: Device not found

  /device/delete/{id}:
    delete:
      summary: Delete device by ID
      tags: [Device]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: Device ID
      responses:
        "200":
          description: Device deleted successfully
        "404":
          description: Device not found

  /device/{id}/command:
    post:
      summary: Send command to device
      tags: [Device]
      description: Mengirim perintah start/stop/end ke device melalui WebSocket
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: Device ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                command:
                  type: string
                  enum: [start, stop, end]
                  description: Perintah yang akan dikirim ke device
              required:
                - command
              example:
                command: "start"
      responses:
        "200":
          description: Perintah berhasil dikirim
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      command:
                        type: object
                      device:
                        type: object
        "400":
          description: Bad Request
        "404":
          description: Device tidak ditemukan

  # TRANSACTION ROUTES
  /transaction/create:
    post:
      summary: Create a new transaction
      tags: [Transaction]
      description: Membuat transaksi baru dan mengirim timer ke device melalui WebSocket
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId:
                  type: string
                  description: ID device yang akan digunakan
                start:
                  type: string
                  format: date-time
                end:
                  type: string
                  format: date-time
                  nullable: true
                duration:
                  type: integer
                  description: Durasi dalam milliseconds
                cost:
                  type: integer
                  description: Biaya transaksi
              required:
                - deviceId
                - duration
      responses:
        "201":
          description: Transaksi berhasil dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      transaction:
                        $ref: "#/components/schemas/Transaction"
                      deviceCommand:
                        type: object
        "400":
          description: Device tidak terkoneksi ke server WebSocket
        "404":
          description: Device tidak ditemukan

  /transaction:
    get:
      summary: Get all transactions
      tags: [Transaction]
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: start_date
          schema:
            type: string
            format: date
          description: Filter by start date (YYYY-MM-DD)
        - in: query
          name: end_date
          schema:
            type: string
            format: date
          description: Filter by end date (YYYY-MM-DD)
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number for pagination
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Number of items per page
      responses:
        "200":
          description: List of transactions
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Transaction"
                  pagination:
                    type: object
                    properties:
                      currentPage:
                        type: integer
                      totalPages:
                        type: integer
                      totalItems:
                        type: integer

  /transaction/user/{userId}:
    get:
      summary: Get transactions by user ID
      tags: [Transaction]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: userId
          schema:
            type: string
          required: true
          description: User ID
        - in: query
          name: start_date
          schema:
            type: string
            format: date
        - in: query
          name: end_date
          schema:
            type: string
            format: date
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: List of user transactions

  /transaction/{id}:
    get:
      summary: Get transaction by ID
      tags: [Transaction]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: Transaction ID
      responses:
        "200":
          description: Transaction data
        "404":
          description: Transaction not found

    put:
      summary: Update transaction
      tags: [Transaction]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: Transaction ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                start:
                  type: string
                  format: date-time
                end:
                  type: string
                  format: date-time
                duration:
                  type: integer
                cost:
                  type: integer
      responses:
        "200":
          description: Transaction updated successfully
        "404":
          description: Transaction not found

    delete:
      summary: Delete transaction
      tags: [Transaction]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: Transaction ID
      responses:
        "200":
          description: Transaction deleted successfully
        "404":
          description: Transaction not found

  /transaction/{transactionId}/add-time:
    post:
      summary: Add time to active transaction
      tags: [Transaction]
      description: Menambah waktu pada transaksi yang sedang aktif
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: transactionId
          schema:
            type: string
          required: true
          description: Transaction ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                additionalTime:
                  type: integer
                  description: Additional time in seconds
              required:
                - additionalTime
              example:
                additionalTime: 300
      responses:
        "200":
          description: Berhasil menambah waktu ke transaksi
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      command:
                        type: object
                      transaction:
                        $ref: "#/components/schemas/Transaction"
                      device:
                        type: object
                      addedTime:
                        type: integer
        "400":
          description: Device tidak memiliki timer yang aktif
        "404":
          description: Transaksi tidak ditemukan atau sudah selesai

  # CONNECTION ROUTES
  /connection/status:
    get:
      summary: Get connection status
      tags: [Connection]
      description: Mendapatkan status koneksi semua device yang terhubung ke WebSocket server
      responses:
        "200":
          description: Connection status
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalClients:
                    type: integer
                  registeredDevices:
                    type: integer
                  devices:
                    type: array
                    items:
                      type: object
                      properties:
                        deviceId:
                          type: string
                        status:
                          type: string
                          enum: [on, off, pause]

  /connection/unregistered:
    get:
      summary: Get unregistered devices
      tags: [Connection]
      description: Mendapatkan daftar device yang terkoneksi ke WebSocket tapi belum terdaftar di database
      responses:
        "200":
          description: List of unregistered devices
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        deviceId:
                          type: string
                        status:
                          type: string

  /connection/disconnected:
    get:
      summary: Get disconnected devices
      tags: [Connection]
      description: Mendapatkan daftar device yang terdaftar di database tapi tidak terkoneksi ke WebSocket
      responses:
        "200":
          description: List of disconnected devices
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        categoryId:
                          type: string
                        lastSeen:
                          type: string
                          format: date-time

  /connection/mobile/notifications:
    get:
      summary: Get mobile notifications (SSE)
      tags: [Connection]
      description: |
        Endpoint untuk mendapatkan notifikasi real-time menggunakan Server-Sent Events (SSE).
        Notifikasi dikirim ketika device disconnect atau timer berubah status.
        Endpoint ini tidak membutuhkan autentikasi.
      responses:
        "200":
          description: Koneksi SSE berhasil dibuka
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  data: {"type":"device_disconnect","deviceId":"abc123","timestamp":"2024-05-30T12:00:00Z","reason":"connection_lost"}
                  
                  data: {"type":"timer_disconnected","deviceId":"abc123","elapsedTime":1800,"timestamp":"2024-05-30T12:00:00Z"}
        "500":
          description: Gagal membuka koneksi SSE
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  error:
                    type: string

  # DASHBOARD ROUTES
  /dashboard:
    get:
      summary: Get dashboard data
      tags: [Dashboard]
      description: Mendapatkan informasi dashboard termasuk status device aktif dan riwayat penggunaan
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary:
                    type: object
                    properties:
                      total_active:
                        type: integer
                      total_inactive:
                        type: integer
                  active_devices:
                    type: array
                    items:
                      type: object
                      properties:
                        device_id:
                          type: string
                        name:
                          type: string
                        category:
                          type: string
                        category_cost:
                          type: integer
                        satuan_waktu:
                          type: string
                        status:
                          type: string
                        timer_start:
                          type: string
                          format: date-time
                        timer_duration:
                          type: integer
                        timer_elapsed:
                          type: integer
                        timer_status:
                          type: string
                        last_paused_at:
                          type: string
                          format: date-time
                  last_used_devices:
                    type: array
                    items:
                      type: object
                      properties:
                        device_id:
                          type: string
                        name:
                          type: string
                        category:
                          type: string
                        category_cost:
                          type: integer
                        satuan_waktu:
                          type: string
                        last_used:
                          type: object
                          properties:
                            start:
                              type: string
                              format: date-time
                            end:
                              type: string
                              format: date-time
                            duration:
                              type: integer
                            cost:
                              type: integer
